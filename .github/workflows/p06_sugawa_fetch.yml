name: p06-sugawa-public-data-fetch

on:
  push:
    branches:
      - tmp/p06-sugawa-fetch-20260818
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-public-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/p06-sugawa-fetch-20260818

      - name: Fetch and validate public supplementary data from PMC AWS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts work
          mkdir -p artifacts work

          bucket="pmc-oa-opendata"
          prefix="$(aws s3api list-objects-v2 --bucket "$bucket" --prefix 'PMC6561486.' --delimiter '/' --query 'CommonPrefixes[0].Prefix' --output text --no-sign-request)"
          if [[ -z "$prefix" || "$prefix" == "None" ]]; then
            echo "No PMC article-version prefix found" >&2
            exit 1
          fi
          printf '%s\n' "$prefix" > artifacts/article_prefix.txt

          aws s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix" --output json --no-sign-request > artifacts/s3_objects.json
          aws s3 ls "s3://$bucket/$prefix" --no-sign-request > artifacts/s3_inventory.txt

          version="${prefix%/}"
          aws s3 cp "s3://$bucket/metadata/${version}.json" artifacts/article_metadata.json --no-sign-request
          aws s3 cp "s3://$bucket/${prefix}${version}.xml" artifacts/article.xml --no-sign-request

          mapfile -t zip_keys < <(python - <<'PY'
          import json
          data=json.load(open('artifacts/article_metadata.json'))
          for item in data.get('media_urls', []):
              url=item.get('url') if isinstance(item, dict) else item
              if isinstance(url, str) and url.lower().endswith('.zip'):
                  marker='s3://pmc-oa-opendata/'
                  print(url.split(marker,1)[1].split('?',1)[0] if marker in url else url)
          PY
          )

          if [[ "${#zip_keys[@]}" -eq 0 ]]; then
            mapfile -t zip_keys < <(python - <<'PY'
          import json
          data=json.load(open('artifacts/s3_objects.json'))
          for obj in data.get('Contents', []):
              key=obj['Key']
              if key.lower().endswith('.zip'):
                  print(key)
          PY
          )
          fi

          if [[ "${#zip_keys[@]}" -eq 0 ]]; then
            echo "No ZIP supplementary object found" >&2
            cat artifacts/article_metadata.json >&2
            exit 1
          fi

          selected=""
          for key in "${zip_keys[@]}"; do
            name="$(basename "$key")"
            aws s3 cp "s3://$bucket/$key" "work/$name" --no-sign-request
            if unzip -t "work/$name" >/dev/null 2>&1; then
              if [[ "$name" == *Dat* || -z "$selected" ]]; then
                selected="work/$name"
              fi
            fi
          done

          if [[ -z "$selected" ]]; then
            echo "No valid ZIP archive found" >&2
            exit 1
          fi

          cp "$selected" artifacts/NIHMS1516098-supplement-Dat.zip
          printf 's3://%s/%s%s\n' "$bucket" "$prefix" "$(basename "$selected")" > artifacts/source_url.txt
          unzip -t artifacts/NIHMS1516098-supplement-Dat.zip
          unzip -l artifacts/NIHMS1516098-supplement-Dat.zip > artifacts/data_zip_inventory.txt
          sha256sum artifacts/NIHMS1516098-supplement-Dat.zip > artifacts/NIHMS1516098-supplement-Dat.zip.sha256
          base64 -w0 artifacts/NIHMS1516098-supplement-Dat.zip > artifacts/NIHMS1516098-supplement-Dat.zip.b64
          wc -c artifacts/NIHMS1516098-supplement-Dat.zip artifacts/NIHMS1516098-supplement-Dat.zip.b64 > artifacts/byte_counts.txt

      - name: Commit fetched public data receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          git commit -m "Fetch public Sugawa 2018 supplementary data"
          git push origin HEAD:tmp/p06-sugawa-fetch-20260818
