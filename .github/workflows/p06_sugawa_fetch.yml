name: p06-sugawa-public-data-fetch

on:
  push:
    branches: [tmp/p06-sugawa-fetch-20260818]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-public-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/p06-sugawa-fetch-20260818

      - name: Discover and fetch public supplementary data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts work
          mkdir -p artifacts work
          bucket=pmc-oa-opendata
          prefix="$(aws s3api list-objects-v2 --bucket "$bucket" --prefix 'PMC6561486.' --delimiter '/' --query 'CommonPrefixes[0].Prefix' --output text --no-sign-request)"
          version="${prefix%/}"
          printf '%s\n' "$prefix" > artifacts/article_prefix.txt
          aws s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix" --output json --no-sign-request > artifacts/s3_objects.json
          aws s3 ls "s3://$bucket/$prefix" --no-sign-request > artifacts/s3_inventory.txt
          aws s3 cp "s3://$bucket/metadata/${version}.json" artifacts/article_metadata.json --no-sign-request
          aws s3 cp "s3://$bucket/${prefix}${version}.xml" artifacts/article.xml --no-sign-request

          curl -fL --retry 2 -A 'Mozilla/5.0 P06-pilot' \
            'https://pmc.ncbi.nlm.nih.gov/articles/PMC6561486/' \
            -o artifacts/article.html || true

          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.parse, urllib.request, zipfile
          from xml.etree import ElementTree as ET

          out=Path('artifacts')
          xml=out.joinpath('article.xml').read_text(errors='replace')
          hrefs=[]
          root=ET.fromstring(xml)
          for elem in root.iter():
              for key,value in elem.attrib.items():
                  if key.endswith('href') or key.lower() in {'href','src'}:
                      if any(token in value.lower() for token in ('supp','dat.zip','.zip','.pdf')):
                          hrefs.append({'tag':elem.tag.split('}')[-1],'id':elem.attrib.get('id'),'attribute':key,'value':value})
          out.joinpath('xml_supplement_hrefs.json').write_text(json.dumps(hrefs,indent=2,ensure_ascii=False)+'\n')

          html=out.joinpath('article.html').read_text(errors='replace') if out.joinpath('article.html').exists() else ''
          html_matches=sorted(set(re.findall(r'''(?:href|src)=["']([^"']*(?:supplement|Dat\.zip|\.zip)[^"']*)["']''',html,re.I)))
          out.joinpath('html_supplement_hrefs.json').write_text(json.dumps(html_matches,indent=2,ensure_ascii=False)+'\n')

          names=[]
          for item in hrefs:
              value=item['value']
              names.append(value)
              names.append(value.rsplit('/',1)[-1])
          names += html_matches
          names += ['NIHMS1516098-supplement-Dat.zip']

          bases=[
            'https://pmc.ncbi.nlm.nih.gov/articles/PMC6561486/',
            'https://pmc.ncbi.nlm.nih.gov/articles/PMC6561486/bin/',
            'https://pmc.ncbi.nlm.nih.gov/articles/instance/6561486/',
            'https://pmc.ncbi.nlm.nih.gov/articles/instance/6561486/bin/',
            'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6561486/bin/',
          ]
          urls=[]
          for value in names:
              if not value: continue
              if value.startswith(('http://','https://')):
                  urls.append(value)
              elif value.startswith('/'):
                  urls.append('https://pmc.ncbi.nlm.nih.gov'+value)
              else:
                  for base in bases:
                      urls.append(urllib.parse.urljoin(base,value))
          urls=list(dict.fromkeys(urls))
          receipts=[]
          success=None
          for i,url in enumerate(urls):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 P06-pilot'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read(5_000_000)
                      info={'url':url,'status':getattr(response,'status',None),'content_type':response.headers.get('Content-Type'),'bytes':len(data),'final_url':response.geturl()}
                  candidate=Path('work')/f'candidate_{i}.bin'
                  candidate.write_bytes(data)
                  if zipfile.is_zipfile(candidate):
                      success=candidate
                      info['valid_zip']=True
                      receipts.append(info)
                      break
                  info['valid_zip']=False
                  receipts.append(info)
              except Exception as exc:
                  receipts.append({'url':url,'error':type(exc).__name__+': '+str(exc)})
          out.joinpath('url_probe_receipts.json').write_text(json.dumps(receipts,indent=2,ensure_ascii=False)+'\n')
          if success:
              target=out/'NIHMS1516098-supplement-Dat.zip'
              target.write_bytes(success.read_bytes())
              out.joinpath('source_url.txt').write_text(receipts[-1]['final_url']+'\n')
              with zipfile.ZipFile(target) as z:
                  inventory=[{'name':x.filename,'bytes':x.file_size,'compressed_bytes':x.compress_size} for x in z.infolist()]
              out.joinpath('data_zip_inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          else:
              out.joinpath('FETCH_STATUS.txt').write_text('SUPPLEMENT_ZIP_NOT_RESOLVED_FROM_PUBLIC_UI\n')
          PY

          if [[ -f artifacts/NIHMS1516098-supplement-Dat.zip ]]; then
            unzip -t artifacts/NIHMS1516098-supplement-Dat.zip
            sha256sum artifacts/NIHMS1516098-supplement-Dat.zip > artifacts/NIHMS1516098-supplement-Dat.zip.sha256
            base64 -w0 artifacts/NIHMS1516098-supplement-Dat.zip > artifacts/NIHMS1516098-supplement-Dat.zip.b64
          fi

      - name: Commit public-data diagnostics and file when resolved
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'Resolve public Sugawa 2018 supplementary data'
          git push origin HEAD:tmp/p06-sugawa-fetch-20260818
